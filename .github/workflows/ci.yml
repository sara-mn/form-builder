name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Install Chromium for Vitest browser mode
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build-prod
      - name: Add SPA fallback for GitHub Pages
        run: cp dist/form-builder/browser/index.html dist/form-builder/browser/404.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/form-builder/browser

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Provide env file for compose
        run: cp server/.env.example server/.env

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Smoke test frontend (nginx)
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/ > /dev/null

      - name: Smoke test API (through nginx proxy)
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/api/forms > /dev/null

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  deploy-frontend:
    needs: [test-and-build, docker-smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5