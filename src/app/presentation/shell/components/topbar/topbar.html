<div class="flex h-14 items-center justify-between border-b border-surface-200 bg-surface-0 px-5 dark:border-surface-700 dark:bg-surface-900">
    <div class="flex items-center gap-2">
        <button
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-md text-surface-600 hover:bg-surface-100 lg:hidden dark:text-surface-300 dark:hover:bg-surface-800"
            (click)="shellState.toggleMobileSidebar()"
            aria-label="Toggle menu"
        >
            <svg pIcon="bars" class="h-5 w-5"></svg>
        </button>

        <a routerLink="/" class="flex items-center gap-2 text-surface-900 no-underline dark:text-surface-0">
            <img [ngSrc]="'assets/img/form_builder_logo_simplified.png'" alt="Form Builder" height="40" width="40" />
            <span class="font-medium">Form Builder</span>
        </a>
    </div>

    <div class="flex items-center gap-4">
        <button pButton type="button" [rounded]="true" [text]="true" severity="secondary" (click)="shellState.toggleDarkMode()" aria-label="Toggle dark mode">
            <svg [pIcon]="shellState.darkTheme() ? 'sun' : 'moon'" class="h-4 w-4"></svg>
        </button>

        <div class="h-5 w-px bg-surface-200 dark:bg-surface-700"></div>

        @if (authState.currentUser(); as user) {
        <a routerLink="/account" class="flex items-center gap-2 text-inherit no-underline hover:opacity-80" data-testid="user-info" aria-label="Account settings">
            <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary/15 text-xs font-medium text-primary">{{ user.name?.charAt(0) }}</div>
            <div class="hidden flex-col leading-tight sm:flex">
                <span class="text-sm font-medium text-surface-900 dark:text-surface-0">{{ user.name }}</span>
                <span class="w-fit rounded-full bg-primary/15 px-1.5 text-xs font-medium text-primary">{{ user.roles[0] }}</span>
            </div>
        </a>
        }

        <button pButton type="button" severity="secondary" [text]="true" (click)="logout()" aria-label="Log out">Log out</button>
    </div>
</div>
