@if (item.items?.length) {
    <button
        type="button"
        class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-surface-700 hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800"
        (click)="toggle()"
        [attr.aria-expanded]="expanded()"
        [attr.aria-label]="'Toggle ' + item.label + ' submenu'"
    >
        <svg [pIcon]="item.icon" class="h-4 w-4 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 text-left">{{ item.label }}</span>
        <svg [pIcon]="expanded() ? 'chevron-up' : 'chevron-down'" class="h-3.5 w-3.5" aria-hidden="true"></svg>
    </button>

    <ul
        class="flex flex-col gap-1 overflow-hidden pl-7 transition-[max-height] duration-200"
        [style.max-height]="expanded() ? '500px' : '0px'"
        [attr.data-testid]="'submenu-' + item.label"
    >
        @for (child of item.items; track child.label) {
            <li>
                <app-nav-item [item]="child" />
            </li>
        }
    </ul>
} @else {
    <a
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-surface-700 hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800"
        [routerLink]="item.routerLink"
        routerLinkActive="!bg-primary/10 !text-primary font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-label]="item.label"
    >
        <svg [pIcon]="item.icon" class="h-4 w-4 shrink-0" aria-hidden="true"></svg>
        <span>{{ item.label }}</span>
    </a>
}
