@for (tile of tiles(); track tile.label) {
    <div class="col-span-12 sm:col-span-6 lg:col-span-3">
        <div
            class="rounded-2xl border border-surface bg-surface-0 p-5 shadow-sm transition-shadow hover:shadow-md dark:bg-surface-900"
            [attr.data-testid]="tile.testId"
        >
            <div class="flex items-start justify-between">
                <div>
                    <span class="block text-sm font-medium text-muted-color">{{ tile.label }}</span>
                    <span class="mt-2 block text-3xl font-bold text-color">{{ tile.value }}</span>
                </div>
                <div class="flex h-12 w-12 items-center justify-center rounded-full" [ngClass]="tile.colorClasses">
                    <svg [pIcon]="tile.icon" class="h-5 w-5"></svg>
                </div>
            </div>
            <span class="mt-3 block text-sm text-muted-color">{{ tile.sublabel }}</span>
        </div>
    </div>
}
