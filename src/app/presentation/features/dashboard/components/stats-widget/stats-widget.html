<div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0" data-testid="stats-total-forms">
        <div class="flex justify-between mb-4">
            <div>
                <span class="block text-muted-color font-medium mb-4">Total Forms</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().totalForms }}</div>
            </div>
            <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-border" style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-file text-blue-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-muted-color">{{ stats().draftForms }} draft</span>
    </div>
</div>
<div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0" data-testid="stats-published-forms">
        <div class="flex justify-between mb-4">
            <div>
                <span class="block text-muted-color font-medium mb-4">Published</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().publishedForms }}</div>
            </div>
            <div class="flex items-center justify-center bg-orange-100 dark:bg-orange-400/10 rounded-border" style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-send text-orange-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-muted-color">visible to viewers</span>
    </div>
</div>
<div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0" data-testid="stats-locked-forms">
        <div class="flex justify-between mb-4">
            <div>
                <span class="block text-muted-color font-medium mb-4">Locked</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().lockedForms }}</div>
            </div>
            <div class="flex items-center justify-center bg-cyan-100 dark:bg-cyan-400/10 rounded-border" style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-lock text-cyan-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-muted-color">have submissions</span>
    </div>
</div>
<div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <div class="card mb-0" data-testid="stats-total-submissions">
        <div class="flex justify-between mb-4">
            <div>
                <span class="block text-muted-color font-medium mb-4">Submissions</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().totalSubmissions }}</div>
            </div>
            <div class="flex items-center justify-center bg-purple-100 dark:bg-purple-400/10 rounded-border" style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-comment text-purple-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-muted-color">across all forms</span>
    </div>
</div>
