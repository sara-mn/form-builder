<div class="rounded-2xl border border-surface bg-surface-0 p-5 shadow-sm dark:bg-surface-900">
    <h2 class="mb-4 text-lg font-semibold text-color">Recent Forms</h2>
    @if (recent().length === 0) {
        <p class="text-sm text-muted-color">No forms yet.</p>
    } @else {
        <ul class="divide-surface divide-y">
            @for (item of recent(); track item.form.id) {
                <li>
                    <a
                        [routerLink]="['/form-designer', item.form.id]"
                        class="-mx-2 flex items-center justify-between gap-4 rounded-lg px-2 py-3 no-underline transition-colors hover:bg-surface-50 dark:hover:bg-surface-800"
                    >
                        <div class="min-w-0">
                            <span class="block truncate text-sm font-medium text-color">{{ item.form.title }}</span>
                            <span class="block text-xs text-muted-color">{{ item.form.pages.length }} page(s)</span>
                        </div>
                        <div class="flex shrink-0 items-center gap-3">
                            <span class="text-sm text-muted-color">{{ item.submissionCount }} submissions</span>
                            <p-tag [value]="item.form.status" [severity]="severityFor(item.form.status)" />
                        </div>
                    </a>
                </li>
            }
        </ul>
    }
</div>
