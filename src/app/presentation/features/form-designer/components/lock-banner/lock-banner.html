<div class="mb-4 flex items-center gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 dark:border-red-900 dark:bg-red-950/40" role="alert">
    <span class="text-xl">🔒</span>
    <div class="flex flex-1 flex-col text-sm text-red-900 dark:text-red-100">
        <strong>This form is locked.</strong>
        <span>It has received submissions and can no longer be edited. Clone it to make changes.</span>
    </div>
    <button pButton type="button" severity="danger" [disabled]="cloning()" (click)="onCloneClick()">{{ cloning() ? 'Cloning...' : 'Clone to Edit' }}</button>
</div>
