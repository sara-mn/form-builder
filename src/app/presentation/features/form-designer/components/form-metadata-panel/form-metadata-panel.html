<div class="mb-6 flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
        <label for="form-title" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Title</label>
        <input id="form-title" type="text" pInputText class="w-full" [value]="title()" (input)="onTitleChange($any($event.target).value)" [disabled]="disabled()" placeholder="Untitled form" />
    </div>
    <div class="flex flex-col gap-1.5">
        <label for="form-description" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Description</label>
        <input id="form-description" type="text" pInputText class="w-full" [value]="description()" (input)="onDescriptionChange($any($event.target).value)" [disabled]="disabled()" placeholder="Optional description" />
    </div>
</div>
