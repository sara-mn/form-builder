<div class="mt-4 border-t border-surface-200 pt-4 dark:border-surface-700">
    <h4 class="mb-2 text-[13px] font-semibold text-surface-600 dark:text-surface-400">Validators</h4>

    @if (validators().length > 0) {
    <ul class="mb-3 flex list-none flex-col gap-1.5 p-0">
        @for (validator of validators(); track validator.id) {
        <li class="flex items-center gap-2 rounded-md bg-surface-50 px-2.5 py-1.5 text-[13px] dark:bg-surface-800">
            <span class="font-semibold text-surface-900 capitalize dark:text-surface-0">{{ validator.type }}</span>
            @if (validator.value !== undefined) {
            <span class="text-surface-500 dark:text-surface-400">({{ validator.value }})</span>
            }
            <span class="flex-1 text-surface-600 dark:text-surface-300">{{ validator.message }}</span>
            <button pButton type="button" severity="danger" [text]="true" [rounded]="true" size="small" (click)="onRemove(validator.id)" aria-label="Remove validator">
                <svg data-p-icon="times" class="h-3.5 w-3.5"></svg>
            </button>
        </li>
        }
    </ul>
    }

    <div class="flex items-center gap-2">
        <p-select [options]="validatorTypes" [ngModel]="newType()" (ngModelChange)="onTypeChange($event)" styleClass="w-40" />

        @if (requiresValue) {
        <input type="text" pInputText placeholder="Value" [ngModel]="newValue()" (ngModelChange)="onValueChange($event)" class="w-24" />
        } @if (valueError()) {
        <span class="text-[13px] text-red-600 dark:text-red-400">{{ valueError() }}</span>
        }

        <input type="text" pInputText placeholder="Error message" [ngModel]="newMessage()" (ngModelChange)="onMessageChange($event)" class="flex-1" />

        <button pButton type="button" size="small" (click)="onAdd()" [disabled]="!!valueError()">Add</button>
    </div>
</div>
