<div class="flex-1 pl-6">
    <div class="mb-4 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-surface-600 dark:text-surface-400">Fields</h3>
        <button pButton type="button" size="small" [disabled]="disabled()" (click)="onAdd()">+ Add Field</button>
    </div>
    <div class="flex flex-col gap-2">
        @for (field of fields(); track field.id) {
        <div class="flex items-center justify-between rounded-lg border border-surface-200 px-3.5 py-2.5 dark:border-surface-700">
            <div class="flex flex-col gap-0.5">
                <span class="text-sm font-medium text-surface-900 dark:text-surface-0">{{ field.label }}</span>
                <span class="text-xs text-surface-500 capitalize dark:text-surface-400">{{ field.type }}</span>
            </div>
            <div class="flex gap-2">
                <button pButton type="button" severity="secondary" [outlined]="true" size="small" [disabled]="disabled()" (click)="onEdit(field)">Edit</button>
                <button pButton type="button" severity="danger" [outlined]="true" size="small" [disabled]="disabled()" (click)="onDelete(field)">Delete</button>
            </div>
        </div>
        } @empty {
        <div class="rounded-lg p-4 text-center text-[13px] text-surface-400 italic dark:text-surface-500">No fields in this page yet.</div>
        }
    </div>
</div>
<p-confirmdialog />
