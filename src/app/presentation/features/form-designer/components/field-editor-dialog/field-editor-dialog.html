<p-dialog [header]="editingField() ? 'Edit Field' : 'Add Field'" [visible]="isOpen()" [modal]="true" [style]="{ width: '32rem' }" (onHide)="onDialogHide()">
    <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
            <label for="field-name" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Name (key)</label>
            <input id="field-name" type="text" pInputText class="w-full" [value]="name()" (input)="onNameChange($any($event.target).value)" />
        </div>

        <div class="flex flex-col gap-1.5">
            <label for="field-label" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Label</label>
            <input id="field-label" type="text" pInputText class="w-full" [value]="label()" (input)="onLabelChange($any($event.target).value)" />
        </div>

        <div class="flex flex-col gap-1.5">
            <label for="field-type" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Type</label>
            <p-select inputId="field-type" [options]="fieldTypes" [ngModel]="type()" (ngModelChange)="onTypeChange($event)" styleClass="w-full" />
        </div>

        @if (showOptions) {
        <div class="flex flex-col gap-1.5">
            <label for="field-options" class="text-[13px] font-semibold text-surface-600 dark:text-surface-400">Options (one per line, key:value)</label>
            <textarea id="field-options" pTextarea rows="3" class="w-full" [value]="optionsText()" (input)="onOptionsTextChange($any($event.target).value)"></textarea>
        </div>
        }

        <app-field-validator-editor [validators]="validators()" (validatorAdded)="onValidatorAdded($event)" (validatorRemoved)="onValidatorRemoved($event)" />
    </div>

    <ng-template #footer>
        <button pButton type="button" severity="secondary" (click)="onDialogHide()">Cancel</button>
        <button pButton type="button" (click)="onSave()">Save</button>
    </ng-template>
</p-dialog>
