<div class="flex min-h-screen items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-sm">
        @if (!submitted()) {
        <h1 class="text-2xl font-medium text-surface-900 dark:text-surface-0">Forgot password?</h1>
        <p class="mt-1 text-sm text-surface-500 dark:text-surface-400">Enter your email and we'll send you a reset link.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-4" data-testid="forgot-password-form">
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-sm font-semibold text-surface-700 dark:text-surface-300">Email</label>
                <input id="email" type="email" pInputText class="w-full" formControlName="email" autocomplete="username" data-testid="forgot-password-email-input" />
            </div>

            <button pButton type="submit" class="mt-2 w-full" [disabled]="form.invalid" data-testid="forgot-password-submit-button">Send reset link</button>
        </form>
        } @else {
        <h1 class="text-2xl font-medium text-surface-900 dark:text-surface-0">Check your email</h1>
        <p class="mt-1 text-sm text-surface-500 dark:text-surface-400">If that email is registered, a reset link has been sent.</p>
        }

        <p class="mt-6 text-sm text-surface-500 dark:text-surface-400"><a routerLink="/login" class="font-medium text-primary">Back to sign in</a></p>
    </div>
</div>
