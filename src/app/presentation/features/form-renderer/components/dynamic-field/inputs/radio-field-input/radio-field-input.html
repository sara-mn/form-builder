<div class="mb-4 flex flex-col gap-1.5">
    <span [id]="field().name + '-label'" class="text-sm font-semibold text-surface-700 dark:text-surface-300">{{
        field().label
    }}</span>
    <div class="flex flex-col gap-2" role="radiogroup" [attr.aria-labelledby]="field().name + '-label'">
        @for (opt of options(); track opt.key) {
            <div class="flex items-center gap-2">
                <p-radiobutton
                    [inputId]="field().name + '-' + opt.key"
                    [value]="opt.key"
                    [formControl]="control()"
                    [name]="field().name"
                />
                <label [for]="field().name + '-' + opt.key" class="text-sm text-surface-700 dark:text-surface-300">{{
                    opt.value
                }}</label>
            </div>
        }
    </div>
    @if (control().invalid && control().touched) {
        <span class="text-[13px] text-red-600 dark:text-red-400">
            @for (error of control().errors | keyvalue; track error.key) {
                {{ error.value }}
            }
        </span>
    }
</div>
