<div class="field-input">
    <label [for]="field().name">{{ field().label }}</label>
    <textarea pTextarea [id]="field().name" rows="3" [formControl]="control()"></textarea>
    @if (control().invalid && control().touched) {
    <span class="field-input__error"> @for (error of control().errors | keyvalue; track error.key) { {{ error.value }} } </span>
    }
</div>
