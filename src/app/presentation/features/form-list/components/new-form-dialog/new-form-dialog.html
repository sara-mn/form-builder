<p-dialog header="New Form" [visible]="isOpen()" [modal]="true" [style]="{ width: '28rem' }" (onHide)="onDialogHide()">
    <div class="new-form-dialog">
        <div class="new-form-dialog__row">
            <label for="new-form-title">Title</label>
            <input id="new-form-title" type="text" [value]="title()" (input)="title.set($any($event.target).value)" placeholder="Untitled form" />
        </div>
        <div class="new-form-dialog__row">
            <label for="new-form-description">Description</label>
            <textarea id="new-form-description" rows="3" [value]="description()" (input)="description.set($any($event.target).value)" placeholder="Optional description"></textarea>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button type="button" class="new-form-dialog__cancel-btn" (click)="onDialogHide()">Cancel</button>
        <button type="button" class="new-form-dialog__save-btn" (click)="onSave()">Create</button>
    </ng-template>
</p-dialog>
