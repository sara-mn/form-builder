<div class="form-list-page">
    <div class="form-list-page__header">
        <h2>Forms</h2>
        <button type="button" class="form-list-page__new-btn" (click)="onNewFormClick()">+ New Form</button>
    </div>

    <p-table [value]="items()" styleClass="form-list-page__table">
        <ng-template #header>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Pages</th>
                <th>Submissions</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-item>
            <tr>
                <td>{{ item.form.title }}</td>
                <td>
                    <app-status-badge [status]="item.form.status" [isLocked]="item.submissionCount > 0" />
                </td>
                <td>{{ item.form.pages.length }}</td>
                <td>{{ item.submissionCount }}</td>
                <td class="form-list-page__actions">
                    <button type="button" (click)="onEdit(item.form.id)">Edit</button>
                    @if (item.submissionCount > 0) {
                    <button type="button" [disabled]="cloningFormId() === item.form.id" (click)="onClone(item.form.id)">{{ cloningFormId() === item.form.id ? 'Cloning...' : 'Clone' }}</button>
                    } @if (item.form.status === FormStatusEnum.Published) {
                    <button type="button" (click)="onFill(item.form.id)">Fill</button>
                    }
                    <button type="button" class="form-list-page__delete-btn" (click)="onDelete(item.form.id, item.form.title)">Delete</button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="5" class="form-list-page__empty">No forms yet. Create your first one.</td>
            </tr>
        </ng-template>
    </p-table>

    <app-new-form-dialog [isOpen]="isNewFormDialogOpen()" (closed)="onNewFormDialogClosed()" (saved)="onNewFormSaved($event)" />
</div>
